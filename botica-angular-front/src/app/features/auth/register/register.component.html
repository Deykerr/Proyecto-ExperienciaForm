<div class="auth-container">
  <div class="auth-card glass-panel" style="max-width: 500px;">
    <div class="logo-container">
      <h2>Registro</h2>
      <p class="text-muted">Crea una nueva cuenta en Botica</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" formControlName="nombre" class="input-control" placeholder="Tus nombres">
        </div>
        
        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" formControlName="apellidos" class="input-control" placeholder="Tus apellidos">
        </div>
      </div>
      
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" formControlName="username" class="input-control" placeholder="Nombre de usuario">
      </div>
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" class="input-control" placeholder="ejemplo@botica.com">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" class="input-control" placeholder="Mínimo 6 caracteres">
      </div>
      
      <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="alert alert-success" style="background-color: rgba(40, 167, 69, 0.1); color: var(--success-color); border: 1px solid rgba(40, 167, 69, 0.2); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.875rem;">
        {{ successMsg }}
      </div>

      <div class="form-actions" style="margin-top: 1rem;">
        <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">Crear Cuenta</button>
      </div>
      
      <div class="auth-links">
        <p>¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
      </div>
    </form>
  </div>
</div>
