<div class="auth-container">
  <div class="auth-card glass-panel">
    <div class="logo-container">
      <h2>Recuperar</h2>
      <p class="text-muted">Ingresa tu correo para restablecer la contraseña</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" class="input-control" placeholder="ejemplo@botica.com">
      </div>
      
      <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="alert alert-success" style="background-color: rgba(40, 167, 69, 0.1); color: var(--success-color); border: 1px solid rgba(40, 167, 69, 0.2); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.875rem;">
        {{ successMsg }}
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary w-100" [disabled]="forgotForm.invalid || isLoading">
          {{ isLoading ? 'Enviando...' : 'Enviar enlace' }}
        </button>
      </div>
      
      <div class="auth-links">
        <a routerLink="/auth/login">Volver al inicio de sesión</a>
      </div>
    </form>
  </div>
</div>
