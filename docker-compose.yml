services:
  postgres-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botica_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend-network

  backend-api:
    build:
      context: ./BOTICA-BACK
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PORT: 9091
      DB_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-botica_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en Base64 en el archivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Administrador inicial}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_CASHIER_PASSWORD: ${DEMO_CASHIER_PASSWORD:-}
      DEMO_STOCKKEEPER_PASSWORD: ${DEMO_STOCKKEEPER_PASSWORD:-}
      SUNAT_ENABLED: ${SUNAT_ENABLED:-false}
      SUNAT_MODE: ${SUNAT_MODE:-BETA}
      SUNAT_RUC: ${SUNAT_RUC:-}
      SUNAT_SOL_USER: ${SUNAT_SOL_USER:-}
      SUNAT_SOL_PASSWORD: ${SUNAT_SOL_PASSWORD:-}
      SUNAT_CERTIFICATE_BASE64: ${SUNAT_CERTIFICATE_BASE64:-}
      SUNAT_CERTIFICATE_PASSWORD: ${SUNAT_CERTIFICATE_PASSWORD:-}
      SUNAT_RAZON_SOCIAL: ${SUNAT_RAZON_SOCIAL:-}
      SUNAT_NOMBRE_COMERCIAL: ${SUNAT_NOMBRE_COMERCIAL:-}
      SUNAT_UBIGEO: ${SUNAT_UBIGEO:-}
      SUNAT_DIRECCION: ${SUNAT_DIRECCION:-}
      SUNAT_DEPARTAMENTO: ${SUNAT_DEPARTAMENTO:-LIMA}
      SUNAT_PROVINCIA: ${SUNAT_PROVINCIA:-LIMA}
      SUNAT_DISTRITO: ${SUNAT_DISTRITO:-LIMA}
      SUNAT_PROCESAMIENTO_MS: ${SUNAT_PROCESAMIENTO_MS:-60000}
      SUNAT_RESUMEN_PROCESAMIENTO_MS: ${SUNAT_RESUMEN_PROCESAMIENTO_MS:-60000}
    depends_on:
      postgres-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-network

  frontend-angular:
    build:
      context: ./botica-angular-front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend-network
      - backend-network

volumes:
  pgdata:

networks:
  frontend-network:
  backend-network:
