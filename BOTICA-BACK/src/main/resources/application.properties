spring.application.name=botica

# =====================================================
# Servidor
# =====================================================
# Render inyectará dinámicamente el puerto HTTP asignado mediante la variable $PORT
server.port=${PORT:9091}

# =====================================================
# Base de datos PostgreSQL
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/botica_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1rZXktZm9yLWJvdGljYS12aXJnZW4tZGVsLWNhcm1lbg==}
jwt.expiration=86400000

# =====================================================
# Serialización JSON
# =====================================================
spring.jackson.serialization.fail-on-empty-beans=false

# =====================================================
# CORS
# =====================================================
# Orígenes separados por coma. No se permite '*' cuando las credenciales CORS
# están habilitadas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# =====================================================
# Observabilidad para Docker
# =====================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =====================================================
# Impuestos
# =====================================================
app.igv.tasa=0.18
