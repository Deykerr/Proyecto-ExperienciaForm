spring.application.name=botica
server.port=${PORT:9091}
server.forward-headers-strategy=framework

# Producción debe proporcionar estas variables. No existen contraseñas de respaldo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.security.cookie-secure=${COOKIE_SECURE:true}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Administrador inicial}

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Lima

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.igv.tasa=${IGV_TASA:0.18}
app.caja.tolerancia-diferencia=${CAJA_TOLERANCIA_DIFERENCIA:0.00}

# SEE del contribuyente SUNAT. Permanece deshabilitado hasta configurar credenciales y certificado PKCS12.
app.sunat.enabled=${SUNAT_ENABLED:false}
app.sunat.mode=${SUNAT_MODE:BETA}
app.sunat.ruc=${SUNAT_RUC:}
app.sunat.sol-user=${SUNAT_SOL_USER:}
app.sunat.sol-password=${SUNAT_SOL_PASSWORD:}
app.sunat.certificate-path=${SUNAT_CERTIFICATE_PATH:}
app.sunat.certificate-base64=${SUNAT_CERTIFICATE_BASE64:}
app.sunat.certificate-password=${SUNAT_CERTIFICATE_PASSWORD:}
app.sunat.razon-social=${SUNAT_RAZON_SOCIAL:}
app.sunat.nombre-comercial=${SUNAT_NOMBRE_COMERCIAL:}
app.sunat.ubigeo=${SUNAT_UBIGEO:}
app.sunat.direccion=${SUNAT_DIRECCION:}
app.sunat.departamento=${SUNAT_DEPARTAMENTO:LIMA}
app.sunat.provincia=${SUNAT_PROVINCIA:LIMA}
app.sunat.distrito=${SUNAT_DISTRITO:LIMA}
app.sunat.procesamiento-ms=${SUNAT_PROCESAMIENTO_MS:60000}
app.sunat.resumen-procesamiento-ms=${SUNAT_RESUMEN_PROCESAMIENTO_MS:60000}
