spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/botica_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.security.cookie-secure=false
spring.jpa.show-sql=true

# Los datos ficticios nunca se crean salvo habilitación explícita.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.demo-data.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo-data.cashier-password=${DEMO_CASHIER_PASSWORD:}
app.demo-data.stockkeeper-password=${DEMO_STOCKKEEPER_PASSWORD:}
